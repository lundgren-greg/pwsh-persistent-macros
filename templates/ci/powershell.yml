name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\\(\.git|templates)\\' }
          if (-not $files) {
            Write-Error "No PowerShell scripts found."
            exit 1
          }
          $errors = @()
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += "$($file.Name): $($parseErrors.Count) parse error(s)"
              $parseErrors | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host "OK: $($file.FullName)"
            }
          }
          if ($errors.Count -gt 0) {
            Write-Error "PowerShell parse errors:`n$($errors -join "`n")"
            exit 1
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\\(\.git|templates)\\' }
          $results = $files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
          }
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "$($results.Count) issue(s) found by PSScriptAnalyzer"
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no issues found"

      - name: Pester (if tests exist)
        shell: pwsh
        run: |
          $pesterFiles = Get-ChildItem -Path tests -Recurse -Filter *.Tests.ps1 -ErrorAction SilentlyContinue
          if (-not $pesterFiles) {
            Write-Host "No Pester tests found — skipping."
            exit 0
          }
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $config
