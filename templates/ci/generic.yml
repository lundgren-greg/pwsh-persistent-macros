name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  repo-kit:
    name: Repo kit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        shell: pwsh
        run: |
          $required = @(
            "README.md",
            "LICENSE",
            "SECURITY.md",
            "CODEOWNERS",
            "PROJECT.md",
            ".editorconfig",
            ".github/workflows/ci.yml"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Missing required repo-kit files:`n$($missing -join "`n")"
            exit 1
          }
          Write-Host "Repo kit files present."
